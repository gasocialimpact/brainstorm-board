# Publishes the app to GitHub Pages when its code changes on main.
# Boards themselves live in Supabase, so creating or editing boards never
# triggers a deploy. Supabase settings come from the repository's Actions
# variables SUPABASE_URL and SUPABASE_ANON_KEY (the anon key is public by
# design; access is controlled in the database, see supabase/schema.sql).
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "supabase/**"
      - "libraries/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
